name: Deploy Stock Portfolio Tracker

on:
  push:
    branches:
      - main
  workflow_dispatch: # This enables manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile
        
      - name: Build Next.js app
        working-directory: ./frontend
        run: bun run build
        env:
          NODE_ENV: production
      
      - name: Deploy to Oracle Cloud Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.PORT }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # Create directory on server if it doesn't exist
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SERVER_USER}@${SERVER_HOST} "mkdir -p /home/${SERVER_USER}/Code/StockThing"
          
          # Copy files to server (exclude node_modules, .next, .git, but include bun.lock)
          rsync -avz --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='*.log' \
            -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            ./frontend/ ${SERVER_USER}@${SERVER_HOST}:/home/${SERVER_USER}/Code/StockThing/frontend/
          
          # Verify bun.lock was copied (important for version matching)
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SERVER_USER}@${SERVER_HOST} \
            "test -f /home/${SERVER_USER}/Code/StockThing/frontend/bun.lock && echo '✅ bun.lock copied successfully' || echo '⚠️ Warning: bun.lock not found on server'"
          
          # Copy root files
          rsync -avz --exclude='.git' \
            -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            plan.md AGENTS.md .github/ ${SERVER_USER}@${SERVER_HOST}:/home/${SERVER_USER}/Code/StockThing/
          
          # Deploy and start Next.js app
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SERVER_USER}@${SERVER_HOST} << EOF
          
          # Navigate to app directory
          cd /home/${SERVER_USER}/Code/StockThing/frontend
          
          # Install Bun if not already installed (use specific version for consistency)
          if ! command -v bun &> /dev/null; then
            echo "Installing Bun..."
            curl -fsSL https://bun.sh/install | bash
            export PATH="\$HOME/.bun/bin:\$PATH"
          fi
          
          # Ensure Bun is in PATH
          export PATH="\$HOME/.bun/bin:\$PATH"
          
          # Verify Bun version
          echo "Bun version: \$(bun --version)"
          
          # Install dependencies using lockfile for exact version matching
          echo "Installing dependencies with frozen lockfile..."
          bun install --frozen-lockfile --production
          
          # Verify lockfile exists
          if [ ! -f "bun.lock" ]; then
            echo "⚠️ Warning: bun.lock not found, versions may not match exactly"
          else
            echo "✅ Using bun.lock for exact version matching"
          fi
          
          # Check if Node.js/npm is available (required for PM2)
          if ! command -v npm &> /dev/null; then
            echo "⚠️ npm not found in PATH. Attempting to locate..."
            # Try common npm locations
            if [ -f "/usr/bin/npm" ]; then
              export PATH="\$PATH:/usr/bin"
            elif [ -f "/usr/local/bin/npm" ]; then
              export PATH="\$PATH:/usr/local/bin"
            fi
            # Check again
            if ! command -v npm &> /dev/null; then
              echo "❌ npm not found. Please install Node.js/npm on the server."
              echo "Run: curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash - && sudo apt-get install -y nodejs"
              exit 1
            fi
          fi
          echo "✅ Node.js version: \$(node --version 2>/dev/null || echo 'not found')"
          echo "✅ npm version: \$(npm --version)"
          
          # Install PM2 if not already installed
          echo "Checking for PM2..."
          PM2_CMD=""
          
          # Try to find PM2 in common locations
          if command -v pm2 &> /dev/null; then
            PM2_CMD=\$(command -v pm2)
            echo "✅ PM2 found in PATH: \$PM2_CMD"
          elif [ -f "/usr/local/bin/pm2" ]; then
            PM2_CMD="/usr/local/bin/pm2"
            echo "✅ PM2 found at: \$PM2_CMD"
          elif [ -f "\$(npm config get prefix)/bin/pm2" ]; then
            PM2_CMD="\$(npm config get prefix)/bin/pm2"
            echo "✅ PM2 found at: \$PM2_CMD"
          else
            echo "PM2 not found, installing globally..."
            npm install -g pm2
            
            # Add npm global bin to PATH
            NPM_PREFIX=\$(npm config get prefix)
            export PATH="\$PATH:\$NPM_PREFIX/bin"
            
            # Try to find PM2 again after installation
            if command -v pm2 &> /dev/null; then
              PM2_CMD=\$(command -v pm2)
              echo "✅ PM2 installed and found at: \$PM2_CMD"
            elif [ -f "\$NPM_PREFIX/bin/pm2" ]; then
              PM2_CMD="\$NPM_PREFIX/bin/pm2"
              echo "✅ PM2 installed and found at: \$PM2_CMD"
            else
              echo "❌ PM2 installation failed. Attempting to locate..."
              find /usr -name pm2 2>/dev/null | head -1 || find /home -name pm2 2>/dev/null | head -1 || echo "PM2 not found anywhere"
              exit 1
            fi
          fi
          
          # Verify PM2 is executable
          if [ ! -x "\$PM2_CMD" ]; then
            echo "❌ PM2 found but not executable: \$PM2_CMD"
            exit 1
          fi
          
          # Test PM2
          echo "Testing PM2..."
          \$PM2_CMD --version || {
            echo "❌ PM2 test failed"
            exit 1
          }
          echo "✅ PM2 is working: \$(\$PM2_CMD --version)"
          
          # Stop any existing PM2 processes
          echo "Stopping existing processes..."
          \$PM2_CMD stop StockThing || true
          \$PM2_CMD delete StockThing || true
          sleep 2
          
          # Start Next.js app with PM2
          echo "Starting Next.js app with PM2..."
          PORT=\${PORT:-3000} \$PM2_CMD start bun --name "StockThing" -- run start
          
          # Save PM2 configuration
          \$PM2_CMD save
          
          # Give it a moment to start
          sleep 5
          
          # Verify PM2 process is running
          if \$PM2_CMD list | grep -q "StockThing.*online"; then
              echo "✅ Stock Portfolio Tracker deployed successfully!"
              echo "📋 Process details:"
              \$PM2_CMD list | grep StockThing
              echo "📁 Working directory: \$(pwd)"
              echo "🌐 App running on: http://0.0.0.0:\${PORT:-3000}"
              
              # Test if the server is responding
              echo "🔍 Testing server response..."
              if curl -s -o /dev/null -w "%{http_code}" http://localhost:\${PORT:-3000} | grep -q "200\|404\|500"; then
                  echo "✅ Server is responding to requests"
              else
                  echo "⚠️ Server may not be responding yet (this is sometimes normal)"
              fi
          else
              echo "❌ Failed to start Stock Portfolio Tracker"
              echo "📋 PM2 logs:"
              \$PM2_CMD logs StockThing --lines 20 --nostream || echo "No PM2 logs found"
              exit 1
          fi
          
          EOF
          
          # Cleanup
          rm -f private_key.pem
