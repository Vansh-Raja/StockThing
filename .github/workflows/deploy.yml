name: Deploy Stock Portfolio Tracker

on:
  push:
    branches:
      - main
  workflow_dispatch: # This enables manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile
      
      - name: Build Next.js app
        working-directory: ./frontend
        run: bun run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:5000/api' }}
      
      - name: Deploy to Oracle Cloud Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.PORT || '3001' }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT || '5000' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'dev-secret-key-change-in-production' }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || 'http://localhost:3001' }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          
          # Create directory on server if it doesn't exist
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SERVER_USER}@${SERVER_HOST} "mkdir -p /home/${SERVER_USER}/Code/StockThing"
          
          # Copy backend files to server (exclude .git, __pycache__, *.pyc, instance/)
          echo "📦 Copying backend files..."
          rsync -avz --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='instance' --exclude='*.log' \
            -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            ./backend/ ${SERVER_USER}@${SERVER_HOST}:/home/${SERVER_USER}/Code/StockThing/backend/
          
          # Copy frontend files to server (exclude node_modules, .next, .git, but include bun.lock)
          echo "📦 Copying frontend files..."
          rsync -avz --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='*.log' \
            -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            ./frontend/ ${SERVER_USER}@${SERVER_HOST}:/home/${SERVER_USER}/Code/StockThing/frontend/
          
          # Verify bun.lock was copied (important for version matching)
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SERVER_USER}@${SERVER_HOST} \
            "test -f /home/${SERVER_USER}/Code/StockThing/frontend/bun.lock && echo '✅ bun.lock copied successfully' || echo '⚠️ Warning: bun.lock not found on server'"
          
          # Copy root files
          rsync -avz --exclude='.git' \
            -e "ssh -o StrictHostKeyChecking=no -i private_key.pem" \
            plan.md AGENTS.md diagnose.sh .github/ ${SERVER_USER}@${SERVER_HOST}:/home/${SERVER_USER}/Code/StockThing/
          
          # Deploy and start Next.js app
          # Pass PORT and BACKEND_PORT environment variables explicitly to SSH session
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SERVER_USER}@${SERVER_HOST} "PORT=${PORT:-3001} BACKEND_PORT=${BACKEND_PORT:-5000} bash -s" << EOF
          
          # Navigate to app directory
          cd /home/${SERVER_USER}/Code/StockThing/frontend
          
          # Export PORT for this session (use provided PORT or default to 3001)
          export PORT=\${PORT:-3001}
          echo "🔧 Using PORT: \$PORT"
          
          # Install Bun if not already installed (use specific version for consistency)
          if ! command -v bun &> /dev/null; then
            echo "Installing Bun..."
            curl -fsSL https://bun.sh/install | bash
            export PATH="\$HOME/.bun/bin:\$PATH"
          fi
          
          # Ensure Bun is in PATH
          export PATH="\$HOME/.bun/bin:\$PATH"
          
          # Verify Bun version
          echo "Bun version: \$(bun --version)"
          
          # Install dependencies using lockfile for exact version matching
          echo "Installing dependencies with frozen lockfile..."
          bun install --frozen-lockfile
          
          # Verify lockfile exists
          if [ ! -f "bun.lock" ]; then
            echo "⚠️ Warning: bun.lock not found, versions may not match exactly"
          else
            echo "✅ Using bun.lock for exact version matching"
          fi
          
          # Build the Next.js app on the server
          echo "Building Next.js app..."
          if [ -d ".next" ]; then
            echo "⚠️ .next directory already exists, rebuilding..."
            rm -rf .next
          fi
          # Set backend API URL for frontend
          BACKEND_API_URL="http://\$(hostname -I | awk '{print \$1}'):\${BACKEND_PORT:-5000}/api"
          NODE_ENV=production NEXT_PUBLIC_API_URL="\${BACKEND_API_URL}" bun run build
          echo "✅ Frontend built with backend API URL: \${BACKEND_API_URL}"
          if [ ! -d ".next" ]; then
            echo "❌ Build failed - .next directory not created"
            exit 1
          else
            echo "✅ Build successful"
          fi
          
          # Check if Node.js/npm is available (required for PM2)
          if ! command -v npm &> /dev/null; then
            echo "⚠️ npm not found in PATH. Attempting to locate..."
            # Try common npm locations
            if [ -f "/usr/bin/npm" ]; then
              export PATH="\$PATH:/usr/bin"
            elif [ -f "/usr/local/bin/npm" ]; then
              export PATH="\$PATH:/usr/local/bin"
            fi
            # Check again
            if ! command -v npm &> /dev/null; then
              echo "❌ npm not found. Please install Node.js/npm on the server."
              echo "Run: curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash - && sudo apt-get install -y nodejs"
              exit 1
            fi
          fi
          echo "✅ Node.js version: \$(node --version 2>/dev/null || echo 'not found')"
          echo "✅ npm version: \$(npm --version)"
          
          # Try to use PM2, fallback to nohup if PM2 fails
          USE_PM2=false
          PM2_CMD=""
          
          # Try to find PM2 in common locations
          if command -v pm2 &> /dev/null; then
            PM2_CMD=\$(command -v pm2)
            echo "✅ PM2 found in PATH: \$PM2_CMD"
            USE_PM2=true
          elif [ -f "/usr/local/bin/pm2" ]; then
            PM2_CMD="/usr/local/bin/pm2"
            echo "✅ PM2 found at: \$PM2_CMD"
            USE_PM2=true
          elif [ -f "\$HOME/.local/bin/pm2" ]; then
            PM2_CMD="\$HOME/.local/bin/pm2"
            echo "✅ PM2 found at: \$PM2_CMD"
            USE_PM2=true
          else
            echo "PM2 not found, attempting to install to user directory..."
            # Install PM2 to user directory (no sudo needed)
            mkdir -p \$HOME/.local/bin
            npm install -g pm2 --prefix \$HOME/.local || {
              echo "⚠️ PM2 installation failed, will use nohup instead"
              USE_PM2=false
            }
            
            if [ -f "\$HOME/.local/bin/pm2" ]; then
              PM2_CMD="\$HOME/.local/bin/pm2"
              export PATH="\$PATH:\$HOME/.local/bin"
              echo "✅ PM2 installed to user directory: \$PM2_CMD"
              USE_PM2=true
            fi
          fi
          
          # Verify PM2 if found
          if [ "\$USE_PM2" = true ] && [ -n "\$PM2_CMD" ]; then
            if [ ! -x "\$PM2_CMD" ]; then
              echo "⚠️ PM2 found but not executable, falling back to nohup"
              USE_PM2=false
            else
              # Test PM2
              \$PM2_CMD --version > /dev/null 2>&1 || {
                echo "⚠️ PM2 test failed, falling back to nohup"
                USE_PM2=false
              }
            fi
          fi
          
          # Stop any existing processes
          echo "Stopping existing processes..."
          if [ "\$USE_PM2" = true ] && [ -n "\$PM2_CMD" ]; then
            \$PM2_CMD stop StockThing || true
            \$PM2_CMD delete StockThing || true
          else
            # Kill existing nohup processes
            pkill -f "bun.*run start" || true
            pkill -f "next start" || true
          fi
          sleep 2
          
          # Start Next.js app
          APP_PORT=\${PORT:-3000}
          echo "🚀 Starting app on port: \$APP_PORT"
          
          if [ "\$USE_PM2" = true ] && [ -n "\$PM2_CMD" ]; then
            echo "Starting Next.js app with PM2 on port \$APP_PORT..."
            # Use explicit -H and -p flags to ensure Next.js binds to 0.0.0.0
            \$PM2_CMD start bun --name "StockThing" -- --bun node_modules/.bin/next start -H 0.0.0.0 -p \$APP_PORT
            \$PM2_CMD save || true
            
            # Setup PM2 to start on boot
            echo "Setting up PM2 to start on boot..."
            # Try system-level startup (requires sudo)
            sudo \$PM2_CMD startup 2>/dev/null || {
              # Fallback: Try user-level startup
              \$PM2_CMD startup 2>/dev/null || {
                echo "⚠️ PM2 startup command failed, will create systemd service manually"
                USE_PM2=false
              }
            }
            
            sleep 5
            
            # Verify PM2 process is running
            if \$PM2_CMD list | grep -q "StockThing.*online"; then
                echo "✅ Stock Portfolio Tracker deployed successfully with PM2!"
                \$PM2_CMD list | grep StockThing
            else
                echo "❌ PM2 failed to start, falling back to nohup..."
                USE_PM2=false
            fi
          fi
          
          # Fallback to nohup if PM2 failed or not available
          if [ "\$USE_PM2" = false ]; then
            echo "Starting Next.js app with nohup (simple background process)..."
            
            # Stop any existing systemd service
            systemctl --user stop stockthing.service 2>/dev/null || true
            systemctl --user disable stockthing.service 2>/dev/null || true
            
            # Create logs directory
            mkdir -p logs
            
            # Kill any existing process on the port
            lsof -ti:\$APP_PORT | xargs kill -9 2>/dev/null || true
            sleep 1
            
            # Start with nohup using explicit -H and -p flags to ensure Next.js binds to 0.0.0.0
            nohup bun --bun node_modules/.bin/next start -H 0.0.0.0 -p \$APP_PORT > logs/app.log 2>&1 &
            APP_PID=\$!
            echo \$APP_PID > logs/app.pid
            echo "Started with PID: \$APP_PID on port: \$APP_PORT"
            
            sleep 5
            
            # Verify process is running
            if ps -p \$APP_PID > /dev/null 2>&1; then
                echo "✅ Stock Portfolio Tracker deployed successfully with nohup!"
                echo "📋 Process PID: \$APP_PID"
                echo "📁 Logs: logs/app.log"
                
                # Create systemd user service for persistence across reboots
                echo "Creating systemd service for auto-start on boot..."
                mkdir -p \$HOME/.config/systemd/user
                
                APP_DIR=\$(pwd)
                BUN_PATH=\$(command -v bun)
                
                printf '[Unit]\nDescription=Stock Portfolio Tracker\nAfter=network.target\n\n[Service]\nType=simple\nWorkingDirectory=%s\nExecStart=%s --bun node_modules/.bin/next start -H 0.0.0.0 -p %s\nRestart=always\nRestartSec=10\nStandardOutput=append:%s/logs/app.log\nStandardError=append:%s/logs/app.log\n\n[Install]\nWantedBy=default.target\n' "\$APP_DIR" "\$BUN_PATH" "\$APP_PORT" "\$APP_DIR" "\$APP_DIR" > \$HOME/.config/systemd/user/stockthing.service
                
                # Reload systemd and enable service
                systemctl --user daemon-reload 2>/dev/null || true
                systemctl --user enable stockthing.service 2>/dev/null || true
                echo "✅ Systemd service created for auto-start on boot"
            else
                echo "❌ Failed to start application"
                echo "📋 Last 20 lines of log:"
                tail -20 logs/app.log 2>/dev/null || echo "No log file found"
                exit 1
            fi
          fi
          
          echo "📁 Working directory: \$(pwd)"
          echo "🌐 App running on: http://0.0.0.0:\$APP_PORT"
          
          # Comprehensive diagnostics
          echo ""
          echo "🔍 Running diagnostics..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Check if process is running
          echo "1. Checking if process is running..."
          if [ "\$USE_PM2" = true ] && [ -n "\$PM2_CMD" ]; then
            \$PM2_CMD list | grep StockThing || echo "❌ PM2 process not found"
          else
            if [ -f logs/app.pid ]; then
              APP_PID=\$(cat logs/app.pid)
              if ps -p \$APP_PID > /dev/null 2>&1; then
                echo "✅ Process running (PID: \$APP_PID)"
              else
                echo "❌ Process not running (PID file exists but process is dead)"
              fi
            else
              echo "⚠️ PID file not found"
            fi
          fi
          
          # Check what's listening on the port
          echo ""
          echo "2. Checking what's listening on port \$APP_PORT..."
          if command -v ss > /dev/null 2>&1; then
            ss -tlnp | grep ":\$APP_PORT " || echo "❌ Nothing listening on port \$APP_PORT"
          elif command -v netstat > /dev/null 2>&1; then
            netstat -tlnp | grep ":\$APP_PORT " || echo "❌ Nothing listening on port \$APP_PORT"
          else
            echo "⚠️ ss/netstat not available"
          fi
          
          # Check firewall status
          echo ""
          echo "3. Checking firewall status..."
          if command -v ufw > /dev/null 2>&1; then
            ufw status | grep "\$APP_PORT" || echo "⚠️ Port \$APP_PORT not found in ufw rules"
          else
            echo "⚠️ ufw not available"
          fi
          
          # Test local connection
          echo ""
          echo "4. Testing local connection..."
          sleep 2
          HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:\$APP_PORT 2>&1 || echo "000")
          if [ "\$HTTP_CODE" = "200" ] || [ "\$HTTP_CODE" = "404" ] || [ "\$HTTP_CODE" = "500" ]; then
            echo "✅ Server responding locally (HTTP \$HTTP_CODE)"
          else
            echo "❌ Server not responding locally (HTTP \$HTTP_CODE)"
            echo "   Last 30 lines of logs:"
            tail -30 logs/app.log 2>/dev/null || echo "   No log file found"
          fi
          
          # Check if binding to 0.0.0.0
          echo ""
          echo "5. Checking network binding..."
          if command -v ss > /dev/null 2>&1; then
            BINDING=\$(ss -tlnp | grep ":\$APP_PORT " | awk '{print \$4}')
            if echo "\$BINDING" | grep -q "0.0.0.0"; then
              echo "✅ Listening on 0.0.0.0:\$APP_PORT (accessible externally)"
            elif echo "\$BINDING" | grep -q "127.0.0.1"; then
              echo "❌ Only listening on 127.0.0.1:\$APP_PORT (NOT accessible externally)"
              echo "   Set HOSTNAME=0.0.0.0 environment variable"
            else
              echo "⚠️ Binding: \$BINDING"
            fi
          fi
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Make diagnose.sh executable
          chmod +x /home/${SERVER_USER}/Code/StockThing/diagnose.sh 2>/dev/null || true
          
          EOF
          
          # Deploy Backend Flask API
          echo "🚀 Deploying Backend Flask API..."
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${SERVER_USER}@${SERVER_HOST} << EOF
          
          # Navigate to backend directory
          cd /home/${SERVER_USER}/Code/StockThing/backend
          
          # Find conda installation
          if [ -f "/home/${SERVER_USER}/miniforge3/bin/conda" ]; then
            CONDA_PATH="/home/${SERVER_USER}/miniforge3"
          elif [ -f "/home/${SERVER_USER}/anaconda3/bin/conda" ]; then
            CONDA_PATH="/home/${SERVER_USER}/anaconda3"
          elif [ -f "\$HOME/miniforge3/bin/conda" ]; then
            CONDA_PATH="\$HOME/miniforge3"
          else
            echo "❌ Conda not found. Please install miniforge3 or anaconda3"
            exit 1
          fi
          
          echo "✅ Found conda at: \${CONDA_PATH}"
          
          # Initialize conda for bash
          eval "\$(\${CONDA_PATH}/bin/conda shell.bash hook)"
          
          # Create conda environment (skip if exists)
          echo "Setting up conda environment..."
          conda create -n StockThing python=3.12.0 -y || echo "Environment already exists, continuing..."
          
          # Activate environment
          conda activate StockThing
          
          # Verify conda environment is active
          if [ "\$CONDA_DEFAULT_ENV" != "StockThing" ]; then
            echo "❌ Failed to activate StockThing environment"
            exit 1
          fi
          echo "✅ Conda environment activated: \${CONDA_DEFAULT_ENV}"
          
          # Stop any existing backend processes
          echo "Stopping existing backend processes..."
          pkill -f "python.*run.py" || true
          pkill -f "gunicorn" || true
          sleep 3
          pkill -9 -f "python.*run.py" || true
          pkill -9 -f "gunicorn" || true
          sleep 2
          echo "Stopped existing processes"
          
          # Install/update requirements including gunicorn
          echo "Installing requirements..."
          \${CONDA_PATH}/envs/StockThing/bin/pip install -r requirements.txt
          \${CONDA_PATH}/envs/StockThing/bin/pip install gunicorn
          
          # Create instance directory for database
          mkdir -p instance
          
          # Set environment variables for backend
          BACKEND_PORT=${BACKEND_PORT:-5000}
          export BACKEND_PORT
          export SECRET_KEY="${SECRET_KEY}"
          export FLASK_DEBUG="False"
          
          # Get server IP for CORS
          SERVER_IP=\$(hostname -I | awk '{print \$1}')
          FRONTEND_URL="http://\${SERVER_IP}:${PORT:-3001}"
          CORS_ORIGINS_VAL="${CORS_ORIGINS},http://localhost:3001,\${FRONTEND_URL},http://\${SERVER_IP}:${PORT:-3001}"
          export CORS_ORIGINS="\${CORS_ORIGINS_VAL}"
          
          echo "✅ Environment variables set"
          echo "   Backend PORT: \${BACKEND_PORT}"
          echo "   CORS_ORIGINS: \${CORS_ORIGINS}"
          
          # Initialize database (if needed)
          echo "Initializing database..."
          \${CONDA_PATH}/envs/StockThing/bin/python -c "
          import os
          os.environ['SECRET_KEY'] = '\${SECRET_KEY}'
          os.environ['FLASK_DEBUG'] = 'False'
          os.environ['CORS_ORIGINS'] = '\${CORS_ORIGINS}'
          from app import create_app
          from app.utils.database import init_db
          app = create_app()
          with app.app_context():
              init_db()
          " || echo "Database initialization completed or already exists"
          
          # Start Flask app with Gunicorn using nohup
          echo "Starting Flask API with Gunicorn..."
          mkdir -p logs
          
          # Kill any existing process on the backend port
          lsof -ti:\${BACKEND_PORT} | xargs kill -9 2>/dev/null || true
          sleep 1
          
          nohup \${CONDA_PATH}/envs/StockThing/bin/gunicorn \
            --bind 0.0.0.0:\${BACKEND_PORT} \
            --workers 3 \
            --timeout 120 \
            --keep-alive 5 \
            --max-requests 1000 \
            --capture-output \
            --enable-stdio-inheritance \
            --access-logfile logs/gunicorn_access.log \
            --error-logfile logs/gunicorn_error.log \
            --log-level info \
            --env SECRET_KEY="\${SECRET_KEY}" \
            --env FLASK_DEBUG="False" \
            --env CORS_ORIGINS="\${CORS_ORIGINS}" \
            run:app \
            >> logs/gunicorn.log 2>&1 &
          
          BACKEND_PID=\$!
          echo \${BACKEND_PID} > logs/backend.pid
          echo "Started backend with PID: \${BACKEND_PID} on port: \${BACKEND_PORT}"
          
          # Give it a moment to start
          sleep 5
          
          # Verify Gunicorn is running
          if ps -p \${BACKEND_PID} > /dev/null 2>&1; then
              echo "✅ Flask API deployed with Gunicorn successfully!"
              echo "📋 Process PID: \${BACKEND_PID}"
              echo "📁 Logs: logs/gunicorn.log"
              echo "🌐 Backend running on: http://0.0.0.0:\${BACKEND_PORT}"
              echo "👥 Workers: 3"
              
              # Test if the server is responding
              echo "🔍 Testing backend server response..."
              HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" http://localhost:\${BACKEND_PORT}/api/accounts 2>&1 || echo "000")
              if [ "\$HTTP_CODE" = "200" ] || [ "\$HTTP_CODE" = "404" ] || [ "\$HTTP_CODE" = "500" ]; then
                  echo "✅ Backend server is responding to requests (HTTP \$HTTP_CODE)"
              else
                  echo "⚠️ Backend server may not be responding yet (HTTP \$HTTP_CODE)"
                  echo "   Last 20 lines of logs:"
                  tail -20 logs/gunicorn.log 2>/dev/null || echo "No log file found"
              fi
          else
              echo "❌ Failed to start Flask API with Gunicorn"
              echo "📋 Recent logs from gunicorn.log:"
              tail -20 logs/gunicorn.log 2>/dev/null || echo "No gunicorn logs found"
              echo "📋 Checking for any error logs:"
              tail -10 logs/*.log 2>/dev/null || echo "No log files found"
              exit 1
          fi
          
          EOF
          
          # Test external connectivity from GitHub Actions runner
          echo "🔍 Testing external connectivity..."
          APP_PORT=${PORT:-3001}
          BACKEND_PORT=${BACKEND_PORT:-5000}
          
          # Test frontend
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 http://${SERVER_HOST}:${APP_PORT} 2>&1 || echo "000")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "500" ]; then
            echo "✅ Frontend is accessible externally (HTTP $HTTP_CODE)"
          else
            echo "❌ Frontend not accessible externally (HTTP $HTTP_CODE)"
            echo "   This could be due to:"
            echo "   - Firewall rules not configured"
            echo "   - Oracle Cloud security list not allowing port $APP_PORT"
            echo "   - App not binding to 0.0.0.0"
            echo "   - App crashed after startup"
          fi
          
          # Test backend
          BACKEND_HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 http://${SERVER_HOST}:${BACKEND_PORT}/api/accounts 2>&1 || echo "000")
          if [ "$BACKEND_HTTP_CODE" = "200" ] || [ "$BACKEND_HTTP_CODE" = "404" ] || [ "$BACKEND_HTTP_CODE" = "500" ]; then
            echo "✅ Backend is accessible externally (HTTP $BACKEND_HTTP_CODE)"
          else
            echo "❌ Backend not accessible externally (HTTP $BACKEND_HTTP_CODE)"
            echo "   This could be due to:"
            echo "   - Firewall rules not configured"
            echo "   - Oracle Cloud security list not allowing port $BACKEND_PORT"
            echo "   - Backend not binding to 0.0.0.0"
            echo "   - Backend crashed after startup"
          fi
          
          # Cleanup
          rm -f private_key.pem
